<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive star map where every cosmic letter is a star waiting to be discovered.">
  <title>Star Map · Cosmic Letters</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>
  <div id="nav-container"></div>

  <main class="page">
    <div class="page__content page__content--wide">
      <div style="text-align: center; margin: 2.5rem 0 1.5rem;">
        <span class="page-kicker">🔭 Deep Field</span>
        <h1 style="font-size: clamp(1.8rem, 4vw, 2.6rem); margin-top: 0.6rem;">Star Map</h1>
        <p style="color: var(--text-muted); margin-top: 0.6rem;">Every message is a star. Click one to reveal what it holds.</p>
        <p id="star-count" style="color: var(--gold); font-family: var(--font-mono); font-size: 0.85rem; margin-top: 0.5rem;"></p>
      </div>

      <div id="cosmic-weather" style="margin-bottom: 1rem;"></div>

      <div class="star-map-container">
        <canvas id="star-map-canvas"></canvas>
      </div>

      <div class="star-map-legend">
        <span><i class="legend-dot" style="background:#a0a0d0"></i>Secret</span>
        <span><i class="legend-dot" style="background:#5aa2ff"></i>Hope</span>
        <span><i class="legend-dot" style="background:#9370f0"></i>Dream</span>
        <span><i class="legend-dot" style="background:#ff7fbd"></i>Confession</span>
        <span><i class="legend-dot" style="background:#f2c94c"></i>Random</span>
      </div>
    </div>
  </main>

  <script type="module" src="src/pages/star-map.js"></script>
</body>
</html>
